spring:
  application:
    name: ChartsSimulator
  profiles:
    active: ${APP_ENV:local}
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 3600 # 1 hour default cache
        cachecontrol:
          max-age: 3600
          cache-public: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Logging configuration
logging:
  level:
    root: WARN
    com.vish.fno.ChartsSimulator: debug
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.springframework.messaging: ${LOG_LEVEL_MESSAGING:WARN}
    org.springframework.web.servlet.DispatcherServlet: ${LOG_LEVEL_DISPATCHER:WARN}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p})\
                  {magenta}%clr(-){faint}%clr([%8.8t]){faint}%clr(%-50.50logger{50}){cyan} %clr(:){faint} %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSSZ} ${LOG_LEVEL_PATTERN:-%5p} ${PID:- } [%8.8t] %-30.30logger{30} : %m%n"
  file:
    name: logs/chart-simulator.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 30
      total-size-cap: 100MB
      file-name-pattern: logs/chart-simulator.%i.%d{yyyy-MM-dd}.log.gz
      clean-history-on-start: false

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Application-wide settings
  environment: ${APP_ENVIRONMENT:development}
  baseurl: ${BASE_URL:https://127.0.0.1/api/v1/historicalData/}
  baseLogPath: ${BASE_LOG_PATH:/Volumes/MacSSD/trading-logs}

  # Application validation and environment settings
  validation:
    environment: ${APP_ENVIRONMENT:development}
    application-name: ${spring.application.name:ChartsSimulator}
    server-port: ${SERVER_PORT:9090}

  # Data access configuration
  data:
    baseurl: ${BASE_URL:https://127.0.0.1/api/v1/historicalData/}
    base-log-path: ${BASE_LOG_PATH:/Volumes/MacSSD/trading-logs}

  # WebSocket configuration
  websocket:
    messageDelay: 10
    tickerDelay: 25 # Fast ticker updates (100ms)
    endpoint: /ws
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090}

  # CORS configuration
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  # Security configuration
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}

  # Ticker data processing configuration
  ticker:
    deduplicateTimestamps: true # Handle duplicate timestamps in ticker API by incrementing by 600ms

  # Backtesting configuration
  backtest:
    strategyName: "moving-average"  # Strategy to use for backtesting
    fixedQuantity: 0             # Fixed quantity per trade (0 = use percentage-based)
    positionSizePercent: 15.0    # Percentage of capital to risk per trade
    stopLossPercent: 2.0         # Stop loss percentage
    takeProfitPercent: 5.0       # Take profit percentage
    defaultInitialCapital: 100000.0  # Default starting capital
    lotSize: 15                  # Lot size for quantity calculation (quantity will be multiple of this)

  # Tick data processor configuration
  tick-processor:
    enabled: true  # Set to true to enable automatic tick processing on startup
    date: 2025-07-18
    symbol: NIFTY 50
    output-path: output/
    deduplicate-timestamps: true
    time-filter:
      enabled: true        # Set to true to enable time range filtering
      start-time: "13:20:00" # Start time (HH:mm:ss format)
      end-time: "14:00:00"   # End time (HH:mm:ss format) - 1:20 PM in 24-hour format

  # Futures symbol mapping and analysis configuration
  futures:
    enabled: true
    symbol-mappings:
      "NIFTY 50": "NIFTY"
      "BANK NIFTY": "BANKNIFTY"
      "NIFTY IT": "NIFTYIT"
      "NIFTY PHARMA": "NIFTYPHARMA"
      "NIFTY AUTO": "NIFTYAUTO"
      "NIFTY METAL": "NIFTYMETAL"
      "NIFTY FMCG": "NIFTYFMCG"
      "SENSEX": "SENSEX"
      "FINNIFTY": "FINNIFTY"
      "MIDCPNIFTY": "MIDCPNIFTY"
    month-codes:
      "JANUARY": "JAN"
      "FEBRUARY": "FEB"
      "MARCH": "MAR"
      "APRIL": "APR"
      "MAY": "MAY"
      "JUNE": "JUN"
      "JULY": "JUL"
      "AUGUST": "AUG"
      "SEPTEMBER": "SEP"
      "OCTOBER": "OCT"
      "NOVEMBER": "NOV"
      "DECEMBER": "DEC"

# Wyckoff Phase Analysis Configuration
wyckoff:
  extrema:
    ha:
      # Extrema detection parameters
      extremaLookback: 5           # Bars for local extrema detection (reduced for faster response)
      extremaThreshold: 0.0005     # 0.05% minimum move for valid extrema (more sensitive)
      extremaConfirmBars: 2        # Bars to confirm extrema (faster confirmation)

      # Heikin-Ashi EMA parameters
      haFastEma: 5                 # Fast EMA on HA (more responsive)
      haSlowEma: 13                # Slow EMA on HA (reduced lag)
      haMediumEma: 8               # Medium EMA for crossovers (faster)

      # Trend detection
      trendStrengthPeriod: 7       # Period for trend strength calculation (faster)
      strongTrendThreshold: 0.0015 # 0.15% for strong trend (more sensitive)
      weakTrendThreshold: 0.0005   # 0.05% for weak trend (more sensitive)

      # Range detection
      rangeLookback: 20            # Bars to detect range (faster detection)
      rangeWidthMin: 0.0015        # 0.15% minimum range width
      rangeWidthMax: 0.005         # 0.5% maximum range width
      rangeBreakoutThreshold: 0.0008 # 0.08% above/below range (more sensitive)

      # Phase detection thresholds
      phaseConfirmBars: 2          # Bars to confirm phase change (much faster)
      accumulationZone: 0.35       # Lower 35% of range (wider zone)
      distributionZone: 0.65       # Upper 65% of range (wider zone)

      # Pattern recognition
      patternLookback: 10          # Bars for pattern detection (faster)
      springThreshold: 0.001       # 0.1% for spring/upthrust detection
      consolidationBars: 8         # Minimum bars for consolidation (faster)

      # Smoothing
      minPhaseLength: 3            # Minimum bars per phase (less smoothing)
      smoothingWindow: 3           # Window for phase smoothing (less lag)

      # Safety
      minBars: 50                  # Minimum bars to analyze

  # Pure Heikin-Ashi Wyckoff Analyzer Configuration
  pure:
    ha:
      # Heikin-Ashi pattern detection
      minConsecutiveCandles: 2     # Minimum consecutive HA candles for trend (reduced for faster detection)
      maxWickRatio: 0.3             # Max wick/body ratio for strong trend (30% - more tolerant)
      haColorRunRequired: 2         # Required consecutive same-color candles (reduced)

      # Market structure
      structureLookback: 15         # Bars for HH/HL/LL/LH detection
      minStructureMove: 0.001       # 0.1% minimum move for valid structure

      # Range detection
      rangeLookback: 30             # Bars for range calculation
      accumulationZone: 0.4         # Bottom 40% of range
      distributionZone: 0.6         # Top 60% of range

      # Trend strength
      trendLookback: 10             # Bars for trend calculation
      strongTrendThreshold: 0.0015  # 0.15% for strong trend

      # Smoothing (minimal)
      minPhaseLength: 2             # Very minimal smoothing
      smoothingWindow: 2            # Minimal smoothing window

      # Safety
      minBars: 30                   # Minimum bars to analyze
