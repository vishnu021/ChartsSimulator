# src/main/resources/application.yml
spring:
  application:
    name: ChartsSimulator
  profiles:
    active: ${APP_ENV:local}
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 3600 # 1 hour default cache
        cachecontrol:
          max-age: 3600
          cache-public: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Logging configuration
logging:
  level:
    com.vish.fno.ChartsSimulator: INFO
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.springframework.messaging: ${LOG_LEVEL_MESSAGING:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  environment: ${APP_ENVIRONMENT:development}
  baseurl: https://127.0.0.1/api/v1/historicalData/
  baseLogPath: /Volumes/MacSSD/trading-logs
  
  websocket:
    messageDelay: 10
    tickerDelay: 25 # Fast ticker updates (100ms)
    endpoint: /ws
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

---
# Development profile
spring:
  config:
    activate:
      on-profile: local,development,dev
      
app:
  environment: development
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090,http://localhost:8080,http://192.168.*:*"
  websocket:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090,http://192.168.*:*"

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.messaging: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: production,prod

app:
  environment: production
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "Accept,Authorization,Content-Type,X-Requested-With"
    allow-credentials: false
  
  security:
    rate-limit:
      enabled: true
      requests-per-minute: 30  # More restrictive in production

logging:
  level:
    org.springframework.web: WARN
    org.springframework.messaging: WARN
