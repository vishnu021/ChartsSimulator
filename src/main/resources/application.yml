spring:
  application:
    name: ChartsSimulator
  profiles:
    active: ${APP_ENV:local}
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 3600 # 1 hour default cache
        cachecontrol:
          max-age: 3600
          cache-public: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# Logging configuration
logging:
  level:
    com.vish.fno.ChartsSimulator: INFO
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.springframework.messaging: ${LOG_LEVEL_MESSAGING:WARN}
    org.springframework.web.servlet.DispatcherServlet: ${LOG_LEVEL_DISPATCHER:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/chart-simulator.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 30
      total-size-cap: 100MB
      file-name-pattern: logs/chart-simulator.%i.%d{yyyy-MM-dd}.log.gz
      clean-history-on-start: false

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Application-wide settings
  environment: ${APP_ENVIRONMENT:development}
  baseurl: ${BASE_URL:https://127.0.0.1/api/v1/historicalData/}
  baseLogPath: ${BASE_LOG_PATH:/Volumes/MacSSD/trading-logs}

  # Application validation and environment settings
  validation:
    environment: ${APP_ENVIRONMENT:development}
    application-name: ${spring.application.name:ChartsSimulator}
    server-port: ${SERVER_PORT:9090}

  # Data access configuration
  data:
    baseurl: ${BASE_URL:https://127.0.0.1/api/v1/historicalData/}
    base-log-path: ${BASE_LOG_PATH:/Volumes/MacSSD/trading-logs}

  # WebSocket configuration
  websocket:
    messageDelay: 10
    tickerDelay: 25 # Fast ticker updates (100ms)
    endpoint: /ws
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090}

  # CORS configuration
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:9090}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  # Security configuration
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}

  # Ticker data processing configuration
  ticker:
    deduplicateTimestamps: true # Handle duplicate timestamps in ticker API by incrementing by 600ms

  # Tick data processor configuration
  tick-processor:
    enabled: true  # Set to true to enable automatic tick processing on startup
    date: 2025-07-18
    symbol: NIFTY 50
    output-path: output/
    deduplicate-timestamps: true
    time-filter:
      enabled: true        # Set to true to enable time range filtering
      start-time: "13:20:00" # Start time (HH:mm:ss format)
      end-time: "14:00:00"   # End time (HH:mm:ss format) - 1:20 PM in 24-hour format

  # Futures symbol mapping and analysis configuration
  futures:
    enabled: true
    symbol-mappings:
      "NIFTY 50": "NIFTY"
      "BANK NIFTY": "BANKNIFTY"
      "NIFTY IT": "NIFTYIT"
      "NIFTY PHARMA": "NIFTYPHARMA"
      "NIFTY AUTO": "NIFTYAUTO"
      "NIFTY METAL": "NIFTYMETAL"
      "NIFTY FMCG": "NIFTYFMCG"
      "SENSEX": "SENSEX"
      "FINNIFTY": "FINNIFTY"
      "MIDCPNIFTY": "MIDCPNIFTY"
    month-codes:
      "JANUARY": "JAN"
      "FEBRUARY": "FEB"
      "MARCH": "MAR"
      "APRIL": "APR"
      "MAY": "MAY"
      "JUNE": "JUN"
      "JULY": "JUL"
      "AUGUST": "AUG"
      "SEPTEMBER": "SEP"
      "OCTOBER": "OCT"
      "NOVEMBER": "NOV"
      "DECEMBER": "DEC"
